name: Build

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build C# project
        run: dotnet build

      - name: Export Android build
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          archive_output: true
          presets_to_export: Android

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ steps.export.outputs.archive_directory }}

  export-ios-compile-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build C# project
        run: dotnet build

      - name: Export iOS Xcode project
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_macos.universal.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          archive_output: false
          presets_to_export: iOS

      # No Apple Developer account in CI, so this only proves the exported
      # Xcode project actually compiles - it does not produce a signed,
      # installable .ipa. That last step needs a real signing session
      # (borrowed Mac / cloud Mac) with an Apple ID.
      - name: Compile-only check (no code signing)
        run: |
          set -e
          PROJECT=$(find "$HOME/.local/share/godot/builds/iOS" -name "*.xcodeproj" | head -1)
          echo "Found Xcode project: $PROJECT"
          xcodebuild -project "$PROJECT" -list
          SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "Using scheme: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build
